name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 UTC 3:00 定期全量扫描
    - cron: '0 3 * * 1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：密钥扫描需覆盖全部提交
      - name: Gitleaks 密钥扫描（代码 + Git 历史）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
